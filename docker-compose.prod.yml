services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_chat}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: migrator
    command: /app/scripts/run_pg_migrations.sh ensure
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PG_CONTAINER: ""
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  harness:
    image: ${HARNESS_IMAGE:-harness/harness:latest}
    profiles: ["harness-self-hosted"]
    restart: unless-stopped
    environment:
      GITNESS_HTTP_HOST: 0.0.0.0
      GITNESS_HTTP_PORT: 3000
      GITNESS_HTTP_PROTO: http
      GITNESS_URL_BASE: ${HARNESS_PUBLIC_BASE_URL:-http://127.0.0.1:13101}
      GITNESS_URL_API: ${HARNESS_PUBLIC_BASE_URL:-http://127.0.0.1:13101}/api
      GITNESS_URL_UI: ${HARNESS_PUBLIC_BASE_URL:-http://127.0.0.1:13101}
      GITNESS_URL_INTERNAL: http://harness:3000
      GITNESS_URL_CONTAINER: http://harness:3000
      GITNESS_URL_GIT: ${HARNESS_GIT_BASE_URL:-http://127.0.0.1:13101/git}
      GITNESS_URL_GIT_SSH: ssh://git@${HARNESS_SSH_PUBLIC_HOST:-127.0.0.1}:${HARNESS_SSH_PORT:-13123}
      GITNESS_PRINCIPAL_ADMIN_EMAIL: ${HARNESS_ADMIN_EMAIL:-admin@relay.local}
      GITNESS_PRINCIPAL_ADMIN_PASSWORD: ${HARNESS_ADMIN_PASSWORD:-change-me-harness-admin}
      GITNESS_METRIC_ENABLED: "false"
      GITNESS_WEBHOOK_ALLOW_LOOPBACK: "true"
      GITNESS_SSH_ENABLE: "true"
      GITNESS_SSH_HOST: 0.0.0.0
      GITNESS_SSH_PORT: 3022
      GITNESS_GITSPACE_ENABLE: ${HARNESS_GITSPACE_ENABLE:-true}
      ENABLE_CI: ${HARNESS_CI_ENABLED:-true}
      GITNESS_DOCKER_HOST: unix:///var/run/docker.sock
      GITNESS_DATABASE_DRIVER: sqlite3
      GITNESS_DATABASE_DATASOURCE: /data/database.sqlite
      GITNESS_GIT_ROOT: /data
      GITNESS_REGISTRY_STORAGE_TYPE: filesystem
      GITNESS_REGISTRY_FILESYSTEM_ROOT_DIRECTORY: /data/registry
      XDG_CACHE_HOME: /data
    ports:
      - "${HARNESS_HOST_PORT:-13101}:3000"
      - "${HARNESS_SSH_PORT:-13123}:3022"
    volumes:
      - harness_prod_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/v1/system/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
    security_opt:
      - no-new-privileges:true

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      network: ${DOCKER_BUILD_NETWORK:-default}
    restart: unless-stopped
    user: "${RELAY_HOST_UID:-1000}:${RELAY_HOST_GID:-1000}"
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/ai_chat}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-16}
      AGENT_TRIGGER_MANAGED_PROJECTS_ROOT: ${AGENT_TRIGGER_MANAGED_PROJECTS_ROOT:-/relay-workspace}
      RELAY_DEFAULT_WORKSPACE_ROOT: ${RELAY_DEFAULT_WORKSPACE_ROOT:-/relay-workspace}
      AGENT_TRIGGER_MODEL_CATALOG_PATH: /relay-trigger-state/codex-models.json
      AGENT_TRIGGER_STATE_ROOT: /relay-trigger-state
      AGENT_TRIGGER_CODEX_CONTROL_ROOT: /relay-trigger-state/codex-control
      AGENT_TRIGGER_GIT_CREDENTIALS_ROOT: /relay-trigger-state/git-credentials
      AGENT_TRIGGER_ALLOWED_LOCAL_ROOTS: ${AGENT_TRIGGER_ALLOWED_LOCAL_ROOTS:-}
      HUMAN_FOLDER_REFERENCE_ALLOWED_ROOTS: ${HUMAN_FOLDER_REFERENCE_ALLOWED_ROOTS:-}
      RELAY_GIT_PROVIDER_KIND: ${RELAY_GIT_PROVIDER_KIND:-}
      RELAY_GIT_PROVIDER_BASE_URL: ${RELAY_GIT_PROVIDER_BASE_URL:-}
      RELAY_GIT_PROVIDER_CLONE_BASE_URL: ${RELAY_GIT_PROVIDER_CLONE_BASE_URL:-}
      RELAY_GIT_PROVIDER_PARENT_REF: ${RELAY_GIT_PROVIDER_PARENT_REF:-}
      RELAY_GIT_PROVIDER_USERNAME: ${RELAY_GIT_PROVIDER_USERNAME:-}
      RELAY_GIT_PROVIDER_TOKEN: ${RELAY_GIT_PROVIDER_TOKEN:-}
      ENABLE_DEV_ENDPOINTS: "false"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      ADMIN_API_TOKENS_JSON: ${ADMIN_API_TOKENS_JSON:-}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
      API_REQUEST_TIMEOUT_SECONDS: ${API_REQUEST_TIMEOUT_SECONDS:-30}
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-1048576}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      EMAIL_DELIVERY_WEBHOOK_URL: ${EMAIL_DELIVERY_WEBHOOK_URL:-}
      HARNESS_MODE: ${HARNESS_MODE:-disabled}
      HARNESS_BASE_URL: ${HARNESS_BASE_URL:-}
      HARNESS_PUBLIC_BASE_URL: ${HARNESS_PUBLIC_BASE_URL:-}
      HARNESS_SPACE_PREFIX: ${HARNESS_SPACE_PREFIX:-u-}
      HARNESS_REQUEST_TIMEOUT_SECONDS: ${HARNESS_REQUEST_TIMEOUT_SECONDS:-15}
      HARNESS_CREDENTIALS_ROOT: /relay-harness-credentials
      MESSAGE_ATTACHMENTS_ROOT: /relay-attachments
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:?set MCP_ALLOWED_HOSTS}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
      WEB_DIST_DIR: /app/web-dist
    volumes:
      - ${AGENT_TRIGGER_STATE_ROOT:?set AGENT_TRIGGER_STATE_ROOT}:/relay-trigger-state:rw
      - ${RELAY_DEFAULT_WORKSPACE_ROOT:?set RELAY_DEFAULT_WORKSPACE_ROOT}:${RELAY_DEFAULT_WORKSPACE_ROOT:?set RELAY_DEFAULT_WORKSPACE_ROOT}:rw
      - ${RELAY_HARNESS_CREDENTIALS_ROOT:?set RELAY_HARNESS_CREDENTIALS_ROOT}:/relay-harness-credentials:rw
      - ${RELAY_MESSAGE_ATTACHMENTS_ROOT:?set RELAY_MESSAGE_ATTACHMENTS_ROOT}:/relay-attachments:rw
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_PORT:-18181}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_prod_data:
  harness_prod_data:
