[workspace]
members = [
  "apps/server",
  "apps/mcp-server",
  "apps/agent-trigger",
  "crates/shared",
  "crates/domain",
  "crates/application",
  "crates/infrastructure",
  "crates/mcp",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.0.4"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
argon2 = "0.5.3"
base64 = "0.22.1"
axum = { version = "0.8.6", features = ["macros", "multipart"] }
chrono = { version = "0.4.42", features = ["clock", "serde"] }
ciborium = "0.2.2"
fallible-iterator = "0.2.0"
fs2 = "0.4.3"
futures-util = "0.3.31"
http = "1.3"
rmcp = { version = "2.2.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1.1", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
sha2 = "0.10.9"
postgres = { version = "=0.19.14", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres = "=0.7.18"
postgres-types = "=0.2.14"
postgres-protocol = "=0.6.12"
rand = "=0.8.6"
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
libc = "0.2.177"
whoami = "=1.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors", "trace", "fs", "timeout"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "=1.8.0", features = ["serde", "v4"] }
